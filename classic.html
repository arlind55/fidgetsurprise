<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Fidget Unboxing</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=chillax@500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
      --radius-sm: 0.5rem; --radius-md: 0.9rem; --radius-lg: 1.25rem; --radius-xl: 1.75rem; --radius-full: 9999px;
      --font-display: 'Chillax', 'Trebuchet MS', sans-serif;
      --font-body: 'Satoshi', 'Helvetica Neue', sans-serif;
      --bg: #fefaf5;
      --surface: rgba(255,255,255,0.42);
      --surface-strong: rgba(255,255,255,0.68);
      --text: #211a25;
      --text-muted: rgba(33,26,37,0.72);
      --line: rgba(33,26,37,0.12);
      --shadow: 0 10px 30px rgba(43, 19, 59, 0.15);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      touch-action: manipulation;
    }
    button { font: inherit; border: 0; background: none; color: inherit; }
    .app {
      position: relative;
      min-height: 100dvh;
      width: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--accent-1) 38%, transparent), transparent 28%),
        radial-gradient(circle at 80% 0%, color-mix(in srgb, var(--accent-2) 26%, transparent), transparent 24%),
        radial-gradient(circle at 80% 80%, color-mix(in srgb, var(--accent-3) 32%, transparent), transparent 28%),
        linear-gradient(180deg, color-mix(in srgb, var(--bg) 84%, white), var(--bg));
    }
    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(255,255,255,0.6), transparent 34%);
      pointer-events: none;
    }
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      padding: calc(var(--safe-top) + var(--space-4)) var(--space-4) calc(var(--safe-bottom) + var(--space-4));
    }
    .screen.active { display: flex; }
    .glass {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: var(--shadow);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }
    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      display: grid;
      place-items: center;
      background: var(--surface-strong);
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: var(--shadow);
    }
    .icon-btn:active, .toy-card:active, .pill-btn:active { transform: scale(0.97); }
    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 0;
    }
    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      display: grid;
      place-items: center;
      box-shadow: inset 0 1px 3px rgba(255,255,255,0.45), 0 8px 20px rgba(0,0,0,0.12);
    }
    .brand-mark svg { width: 26px; height: 26px; }
    .brand h1, .brand h2 { margin: 0; font-family: var(--font-display); line-height: 1; }
    .brand h1 { font-size: var(--text-lg); }
    .brand p { margin: 0; font-size: var(--text-xs); color: var(--text-muted); }
    .opening {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: var(--space-5);
    }
    .opening-card {
      width: min(100%, 34rem);
      padding: var(--space-8) var(--space-5);
      border-radius: 2rem;
      position: relative;
      overflow: hidden;
    }
    .opening-card::after {
      content: "";
      position: absolute;
      inset: auto -20% -35% -20%;
      height: 130px;
      background: radial-gradient(circle, rgba(255,255,255,0.55), transparent 65%);
      filter: blur(12px);
    }
    .opening-title {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 10vw, 4.4rem);
      margin: 0;
      letter-spacing: 0.01em;
    }
    .opening-sub {
      margin: 0;
      color: var(--text-muted);
      font-size: var(--text-base);
    }
    .toy-preview-row {
      display: flex;
      justify-content: center;
      gap: var(--space-4);
      margin-top: var(--space-5);
      flex-wrap: wrap;
    }
    .toy-preview {
      width: 84px;
      height: 84px;
      border-radius: 26px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.48);
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.6), 0 12px 24px rgba(0,0,0,0.08);
      animation: floaty 3.6s ease-in-out infinite;
    }
    .toy-preview:nth-child(2) { animation-delay: .35s; }
    .toy-preview:nth-child(3) { animation-delay: .7s; }
    @keyframes floaty {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .hint-chip {
      display: inline-flex;
      gap: var(--space-2);
      align-items: center;
      border-radius: var(--radius-full);
      padding: 0.7rem 1rem;
      background: rgba(255,255,255,0.56);
      border: 1px solid rgba(255,255,255,0.48);
      font-size: var(--text-sm);
    }
    .shelf {
      flex-direction: column;
      max-width: 56rem;
      width: 100%;
      margin: 0 auto;
    }
    .shelf-grid {
      display: grid;
      gap: var(--space-4);
      grid-template-columns: 1fr;
      padding-bottom: var(--space-4);
      overflow: auto;
    }
    .toy-card {
      min-height: 150px;
      border-radius: 1.6rem;
      padding: var(--space-5);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: var(--space-3);
      text-align: left;
      position: relative;
      overflow: hidden;
      background: color-mix(in srgb, var(--surface-strong) 88%, white);
      border: 1px solid rgba(255,255,255,0.58);
      box-shadow: var(--shadow);
    }
    .toy-card::before {
      content: "";
      position: absolute;
      inset: -30% auto auto -20%;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--card-color) 42%, white);
      opacity: 0.5;
      filter: blur(6px);
    }
    .toy-card h3 { margin: 0 0 .35rem; font-size: var(--text-lg); font-family: var(--font-display); }
    .toy-card p { margin: 0; color: var(--text-muted); font-size: var(--text-sm); max-width: 24ch; }
    .toy-visual {
      width: 92px;
      height: 92px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--card-color) 42%, white);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.7), 0 12px 22px rgba(0,0,0,0.08);
    }
    .play-screen {
      flex-direction: column;
      max-width: 62rem;
      width: 100%;
      margin: 0 auto;
      gap: var(--space-4);
    }
    .canvas-wrap {
      flex: 1;
      min-height: 0;
      border-radius: 2rem;
      padding: var(--space-4);
      position: relative;
      background: color-mix(in srgb, var(--surface-strong) 88%, white);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: var(--shadow);
    }
    canvas {
      width: 100%;
      height: 100%;
      border-radius: 1.4rem;
      background: color-mix(in srgb, var(--bg) 76%, white);
      touch-action: none;
    }
    .bottombar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
    }
    .pill-btn {
      min-height: 52px;
      border-radius: var(--radius-full);
      padding: 0.9rem 1rem;
      background: color-mix(in srgb, var(--surface-strong) 88%, white);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: var(--shadow);
      text-align: center;
      font-weight: 700;
      font-size: var(--text-sm);
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: end;
      justify-content: center;
      padding: var(--space-4);
      background: rgba(24, 14, 32, 0.28);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .overlay.active { display: flex; }
    .sheet {
      width: min(100%, 32rem);
      border-radius: 1.8rem;
      padding: var(--space-5);
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.64);
      box-shadow: 0 20px 48px rgba(24, 14, 32, 0.25);
    }
    .sheet h3 { margin: 0 0 .5rem; font-family: var(--font-display); font-size: var(--text-xl); }
    .sheet p { margin: 0 0 var(--space-4); color: var(--text-muted); }
    .sheet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: 0.95rem 0;
      border-top: 1px solid var(--line);
    }
    .toggle {
      min-width: 76px;
      min-height: 44px;
      border-radius: var(--radius-full);
      padding: 0.35rem;
      background: color-mix(in srgb, var(--accent-1) 42%, white);
      position: relative;
    }
    .toggle::after {
      content: "";
      position: absolute;
      top: 6px;
      left: 6px;
      width: 32px;
      height: 32px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.14);
      transition: transform 180ms ease;
    }
    .toggle.off { background: rgba(0,0,0,0.12); }
    .toggle.off::after { transform: translateX(32px); }
    .mini-palette { display: flex; gap: 8px; }
    .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
    @media (min-width: 768px) {
      .screen { padding-inline: var(--space-6); }
      .shelf-grid { grid-template-columns: 1fr 1fr; }
      .toy-card[data-toy="keyboard"] { grid-column: span 2; }
      .canvas-wrap { padding: var(--space-5); }
    }
  </style>
</head>
<body>
  <div class="app" id="appRoot">
    <main id="mainContent">
      <section class="screen opening active" id="screen-opening" aria-label="Opening screen">
        <div class="opening-card glass">
          <div class="brand" style="justify-content:center; margin-bottom: var(--space-5);">
            <div class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-label="Fidget Unboxing logo">
                <rect x="4.5" y="6.5" width="15" height="11" rx="5.2"></rect>
                <circle cx="9" cy="12" r="1.1" fill="currentColor"></circle>
                <circle cx="12" cy="12" r="1.1" fill="currentColor"></circle>
                <circle cx="15" cy="12" r="1.1" fill="currentColor"></circle>
              </svg>
            </div>
          </div>
          <p class="opening-sub">Today’s fidget colours</p>
          <h1 class="opening-title">Fidget Unboxing</h1>
          <div class="toy-preview-row" aria-hidden="true">
            <div class="toy-preview" id="previewPop"></div>
            <div class="toy-preview" id="previewSquish"></div>
            <div class="toy-preview" id="previewKeys"></div>
          </div>
        </div>
        <button class="hint-chip glass" id="startNowBtn">Tap anywhere to start</button>
      </section>

      <section class="screen shelf" id="screen-shelf" aria-label="Toy shelf">
        <header class="topbar">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4.5" y="6.5" width="15" height="11" rx="5.2"></rect>
                <circle cx="9" cy="12" r="1.1" fill="currentColor"></circle>
                <circle cx="12" cy="12" r="1.1" fill="currentColor"></circle>
                <circle cx="15" cy="12" r="1.1" fill="currentColor"></circle>
              </svg>
            </div>
            <div>
              <h1>Fidget Unboxing</h1>
              <p>Pick a fidget</p>
            </div>
          </div>
          <div style="display:flex; gap: var(--space-2);">
            <button class="icon-btn" id="shuffleBtn" aria-label="Shuffle colour palette">↻</button>
            <button class="icon-btn" id="settingsBtn" aria-label="Open settings">⚙</button>
          </div>
        </header>
        <div class="shelf-grid">
          <button class="toy-card" data-toy="popit" style="--card-color: var(--accent-1);">
            <div>
              <h3>Pop-it</h3>
              <p>Tap soft bubbles and let the board bounce back into shape.</p>
            </div>
            <div class="toy-visual" id="cardPop"></div>
          </button>
          <button class="toy-card" data-toy="squishy" style="--card-color: var(--accent-2);">
            <div>
              <h3>Squishy</h3>
              <p>Press, drag, and release a glossy jelly blob that slowly wobbles home.</p>
            </div>
            <div class="toy-visual" id="cardSquish"></div>
          </button>
          <button class="toy-card" data-toy="keyboard" style="--card-color: var(--accent-3);">
            <div>
              <h3>Clicky keyboard</h3>
              <p>Tap oversized toy keys for a tidy row of playful clicks.</p>
            </div>
            <div class="toy-visual" id="cardKeys"></div>
          </button>
        </div>
      </section>

      <section class="screen play-screen" id="screen-play" aria-label="Toy play area">
        <header class="topbar">
          <button class="icon-btn" id="backBtn" aria-label="Back to shelf">←</button>
          <div class="brand" style="justify-content:center; text-align:center; flex:1;">
            <div>
              <h2 id="playTitle">Pop-it</h2>
              <p id="playSubtitle">Tap and relax</p>
            </div>
          </div>
          <button class="icon-btn" id="playSettingsBtn" aria-label="Open settings">⚙</button>
        </header>
        <div class="canvas-wrap glass">
          <canvas id="toyCanvas" aria-label="Fidget toy canvas"></canvas>
        </div>
        <div class="bottombar">
          <button class="pill-btn" id="resetBtn">Reset toy</button>
          <button class="pill-btn" id="shelfBtn">Toy shelf</button>
        </div>
      </section>
    </main>

    <div class="overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet">
        <h3 id="settingsTitle">Settings</h3>
        <p>Quick controls for the current play session.</p>
        <div class="sheet-row">
          <div>
            <strong>Sound</strong>
            <div style="font-size: var(--text-sm); color: var(--text-muted);">Soft toy sounds only</div>
          </div>
          <button class="toggle" id="soundToggle" aria-label="Toggle sound"></button>
        </div>
        <div class="sheet-row">
          <div>
            <strong>Shuffle colours</strong>
            <div style="font-size: var(--text-sm); color: var(--text-muted);">Create a fresh surprise palette</div>
          </div>
          <button class="pill-btn" id="overlayShuffle" style="min-width: 120px;">Shuffle</button>
        </div>
        <div class="sheet-row" style="align-items:flex-start;">
          <div>
            <strong>Current palette</strong>
            <div style="font-size: var(--text-sm); color: var(--text-muted);">Colours used in this session</div>
          </div>
          <div class="mini-palette" id="palettePreview"></div>
        </div>
        <div class="sheet-row">
          <div>
            <strong>Close</strong>
            <div style="font-size: var(--text-sm); color: var(--text-muted);">Return to play</div>
          </div>
          <button class="pill-btn" id="closeSettingsBtn" style="min-width: 120px;">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const COLORS = ['#42f5f5', '#f57ff1', '#acf5a6', '#b22ac7', '#f2f18a', '#f73725'];
    const state = {
      screen: 'opening',
      toy: 'popit',
      soundOn: true,
      palette: [],
      paletteName: '',
      audioCtx: null,
      openedAudio: false,
      popit: { bubbles: [], columns: 6, rows: 4 },
      squishy: { wobble: 0, target: 0, dragX: 0, dragY: 0, pressed: false },
      keyboard: { keys: [] }
    };

    const appRoot = document.getElementById('appRoot');
    const screens = {
      opening: document.getElementById('screen-opening'),
      shelf: document.getElementById('screen-shelf'),
      play: document.getElementById('screen-play')
    };
    const canvas = document.getElementById('toyCanvas');
    const ctx = canvas.getContext('2d');
    const palettePreview = document.getElementById('palettePreview');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const playTitle = document.getElementById('playTitle');
    const playSubtitle = document.getElementById('playSubtitle');
    const previewPop = document.getElementById('previewPop');
    const previewSquish = document.getElementById('previewSquish');
    const previewKeys = document.getElementById('previewKeys');
    const cardPop = document.getElementById('cardPop');
    const cardSquish = document.getElementById('cardSquish');
    const cardKeys = document.getElementById('cardKeys');
    const soundToggle = document.getElementById('soundToggle');

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function choosePalette() {
      const sample = shuffle(COLORS).slice(0, 4);
      state.palette = sample;
      document.documentElement.style.setProperty('--accent-1', sample[0]);
      document.documentElement.style.setProperty('--accent-2', sample[1]);
      document.documentElement.style.setProperty('--accent-3', sample[2]);
      document.documentElement.style.setProperty('--accent-4', sample[3]);
      document.documentElement.style.setProperty('--bg', mixHex(sample[0], '#fff7f5', 0.24));
      document.documentElement.style.setProperty('--surface', hexToRgba(mixHex(sample[1], '#ffffff', 0.72), 0.54));
      document.documentElement.style.setProperty('--surface-strong', hexToRgba(mixHex(sample[2], '#ffffff', 0.78), 0.78));
      renderPalettePreview();
      renderToyPreviews();
      renderCardVisuals();
    }

    function renderPalettePreview() {
      palettePreview.innerHTML = '';
      state.palette.forEach(color => {
        const dot = document.createElement('span');
        dot.className = 'swatch';
        dot.style.background = color;
        palettePreview.appendChild(dot);
      });
    }

    function showScreen(name) {
      state.screen = name;
      Object.entries(screens).forEach(([key, el]) => el.classList.toggle('active', key === name));
      if (name === 'play') resizeCanvas();
    }

    function openToy(name) {
      state.toy = name;
      const copy = {
        popit: ['Pop-it', 'Tap and relax'],
        squishy: ['Squishy', 'Press and release'],
        keyboard: ['Clicky keyboard', 'Tap the toy keys']
      };
      playTitle.textContent = copy[name][0];
      playSubtitle.textContent = copy[name][1];
      if (name === 'popit') initPopit();
      if (name === 'squishy') initSquishy();
      if (name === 'keyboard') initKeyboard();
      showScreen('play');
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(300, Math.floor(rect.width * dpr));
      canvas.height = Math.max(420, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (state.toy === 'popit') initPopit();
      if (state.toy === 'keyboard') initKeyboard();
    }

    function initPopit() {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      const columns = width > 540 ? 7 : 6;
      const rows = width > 540 ? 5 : 4;
      state.popit.columns = columns;
      state.popit.rows = rows;
      const gap = 14;
      const radius = Math.min((width - 70 - (columns - 1) * gap) / (columns * 2), (height - 120 - (rows - 1) * gap) / (rows * 2));
      const startX = (width - (columns * radius * 2 + (columns - 1) * gap)) / 2 + radius;
      const startY = (height - (rows * radius * 2 + (rows - 1) * gap)) / 2 + radius;
      state.popit.bubbles = [];
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < columns; col++) {
          state.popit.bubbles.push({
            x: startX + col * (radius * 2 + gap),
            y: startY + row * (radius * 2 + gap),
            r: radius,
            pressed: false,
            scale: 1
          });
        }
      }
    }

    function initSquishy() {
      state.squishy.wobble = 0;
      state.squishy.target = 0;
      state.squishy.dragX = 0;
      state.squishy.dragY = 0;
      state.squishy.pressed = false;
    }

    function initKeyboard() {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      const rows = [
        ['Q','W','E','R','T'],
        ['A','S','D','F','G'],
        ['Z','X','C','V','B']
      ];
      const keyW = Math.min(72, (width - 90) / 5);
      const keyH = Math.min(76, (height - 170) / 3);
      const gap = 12;
      const totalH = keyH * 3 + gap * 2;
      const startY = (height - totalH) / 2;
      state.keyboard.keys = [];
      rows.forEach((letters, rowIndex) => {
        const rowWidth = letters.length * keyW + (letters.length - 1) * gap;
        const startX = (width - rowWidth) / 2;
        letters.forEach((letter, i) => {
          state.keyboard.keys.push({
            letter,
            x: startX + i * (keyW + gap),
            y: startY + rowIndex * (keyH + gap),
            w: keyW,
            h: keyH,
            pressedAt: 0
          });
        });
      });
    }

    function drawRoundedRect(x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
    }

    function drawPopit() {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      drawRoundedRect(24, 30, width - 48, height - 60, 34, mixAlpha(state.palette[0], 0.35), mixAlpha('#ffffff', 0.55));
      state.popit.bubbles.forEach((bubble, i) => {
        bubble.scale += ((bubble.pressed ? 0.88 : 1) - bubble.scale) * 0.18;
        const baseColor = state.palette[i % state.palette.length];
        ctx.beginPath();
        ctx.arc(bubble.x, bubble.y, bubble.r * bubble.scale, 0, Math.PI * 2);
        ctx.fillStyle = bubble.pressed ? mixHex(baseColor, '#4b2a5d', 0.48) : baseColor;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = bubble.pressed ? mixAlpha('#2e193b', 0.28) : mixAlpha('#ffffff', 0.62);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(bubble.x, bubble.y - bubble.r * 0.28, bubble.r * 0.44, 0, Math.PI * 2);
        ctx.fillStyle = bubble.pressed ? mixAlpha('#ffffff', 0.08) : mixAlpha('#ffffff', 0.22);
        ctx.fill();
      });
    }

    function drawSquishy() {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      const { dragX, dragY, pressed } = state.squishy;
      state.squishy.wobble += (state.squishy.target - state.squishy.wobble) * 0.16;
      const cx = width / 2 + dragX * 0.2;
      const cy = height / 2 + dragY * 0.16;
      const rx = width * 0.24 + Math.abs(dragX) * 0.18 + state.squishy.wobble * 10;
      const ry = height * 0.16 - Math.min(pressed ? 18 : 0, 18) + Math.abs(dragY) * 0.06;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, Math.max(80, ry), Math.sin(state.squishy.wobble * 0.04) * 0.18, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(-40, -30, 20, 0, 0, rx);
      grad.addColorStop(0, mixHex(state.palette[1], '#ffffff', 0.34));
      grad.addColorStop(1, mixHex(state.palette[3] || state.palette[0], '#ffffff', 0.16));
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = mixAlpha('#ffffff', 0.55);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(-30, -25, rx * 0.28, ry * 0.18, -0.4, 0, Math.PI * 2);
      ctx.fillStyle = mixAlpha('#ffffff', 0.28);
      ctx.fill();
      ctx.restore();
    }

    function drawKeyboard(timestamp) {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      drawRoundedRect(28, 36, width - 56, height - 72, 34, mixAlpha(state.palette[2], 0.24), mixAlpha('#ffffff', 0.58));
      state.keyboard.keys.forEach((key, index) => {
        const down = timestamp - key.pressedAt < 120;
        const yOffset = down ? 8 : 0;
        const fill = down ? mixHex(state.palette[index % state.palette.length], '#342146', 0.34) : mixHex(state.palette[index % state.palette.length], '#ffffff', 0.18);
        drawRoundedRect(key.x, key.y + yOffset, key.w, key.h, 16, fill, mixAlpha('#ffffff', 0.56));
        ctx.fillStyle = down ? mixAlpha('#ffffff', 0.82) : '#2d2036';
        ctx.font = `700 ${Math.min(28, key.h * 0.36)}px var(--font-body)`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(key.letter, key.x + key.w / 2, key.y + yOffset + key.h / 2 + 1);
      });
    }

    function render(timestamp = 0) {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      if (state.screen === 'play') {
        if (state.toy === 'popit') drawPopit();
        if (state.toy === 'squishy') drawSquishy();
        if (state.toy === 'keyboard') drawKeyboard(timestamp);
      }
      requestAnimationFrame(render);
    }

    function pointFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      const touch = event.touches ? event.touches[0] : event;
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }

    function handlePress(point) {
      if (state.toy === 'popit') {
        state.popit.bubbles.forEach(b => {
          const dx = point.x - b.x;
          const dy = point.y - b.y;
          if (Math.hypot(dx, dy) <= b.r + 6) {
            b.pressed = !b.pressed;
            playToySound('pop');
          }
        });
      }
      if (state.toy === 'squishy') {
        state.squishy.pressed = true;
        state.squishy.target = 1;
        state.squishy.dragX = 0;
        state.squishy.dragY = 0;
        playToySound('squish');
      }
      if (state.toy === 'keyboard') {
        state.keyboard.keys.forEach((key, index) => {
          if (point.x >= key.x && point.x <= key.x + key.w && point.y >= key.y && point.y <= key.y + key.h) {
            key.pressedAt = performance.now();
            playToySound('key', index);
          }
        });
      }
    }

    function handleMove(point) {
      if (state.toy === 'squishy' && state.squishy.pressed) {
        const rect = canvas.getBoundingClientRect();
        state.squishy.dragX = Math.max(-80, Math.min(80, point.x - rect.width / 2));
        state.squishy.dragY = Math.max(-70, Math.min(70, point.y - rect.height / 2));
      }
    }

    function handleRelease() {
      if (state.toy === 'squishy') {
        state.squishy.pressed = false;
        state.squishy.target = 0;
        state.squishy.dragX *= 0.35;
        state.squishy.dragY *= 0.35;
      }
    }

    function resetCurrentToy() {
      if (state.toy === 'popit') initPopit();
      if (state.toy === 'squishy') initSquishy();
      if (state.toy === 'keyboard') initKeyboard();
    }

    function ensureAudio() {
      if (state.openedAudio) return;
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      state.audioCtx.resume();
      state.openedAudio = true;
    }

    function playToySound(type, seed = 0) {
      if (!state.soundOn) return;
      ensureAudio();
      const ac = state.audioCtx;
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      const filter = ac.createBiquadFilter();
      osc.connect(filter).connect(gain).connect(ac.destination);
      if (type === 'pop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240 + Math.random() * 70, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.09);
        filter.type = 'lowpass';
        filter.frequency.value = 1200;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'squish') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.14);
        filter.type = 'lowpass';
        filter.frequency.value = 700;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.06, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        osc.start(now); osc.stop(now + 0.2);
      } else {
        osc.type = 'square';
        const base = 350 + (seed % 5) * 42;
        osc.frequency.setValueAtTime(base, now);
        osc.frequency.linearRampToValueAtTime(base * 0.96, now + 0.03);
        filter.type = 'bandpass';
        filter.frequency.value = 1200;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.04, now + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
        osc.start(now); osc.stop(now + 0.07);
      }
    }

    function renderToyPreviews() {
      previewPop.innerHTML = `<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><rect x="8" y="10" width="40" height="28" rx="14" fill="${state.palette[0]}"/><g fill="${mixHex(state.palette[0], '#ffffff', 0.52)}">${[14,22,30,38].map(x=>`<circle cx="${x}" cy="24" r="4.4"/>`).join('')}</g></svg>`;
      previewSquish.innerHTML = `<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><path d="M13 34c0-10 8-18 18-18s18 8 18 18c0 6-6 11-18 11S13 40 13 34Z" fill="${state.palette[1]}"/><ellipse cx="25" cy="25" rx="8" ry="5" fill="rgba(255,255,255,0.28)"/></svg>`;
      previewKeys.innerHTML = `<svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><rect x="8" y="14" width="42" height="28" rx="12" fill="${state.palette[2]}"/><g fill="${mixHex(state.palette[2], '#ffffff', 0.64)}"><rect x="14" y="20" width="8" height="8" rx="3"/><rect x="25" y="20" width="8" height="8" rx="3"/><rect x="36" y="20" width="8" height="8" rx="3"/><rect x="19" y="31" width="20" height="6" rx="3"/></g></svg>`;
    }

    function renderCardVisuals() {
      cardPop.innerHTML = `<svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><rect x="10" y="16" width="52" height="36" rx="18" fill="${state.palette[0]}"/><g fill="${mixHex(state.palette[0], '#ffffff', 0.56)}">${[20,30,40,50].map(x=>`<circle cx="${x}" cy="34" r="5"/>`).join('')}</g></svg>`;
      cardSquish.innerHTML = `<svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><path d="M17 42c0-12 9-21 21-21s21 9 21 21c0 7-7 12-21 12s-21-5-21-12Z" fill="${state.palette[1]}"/><ellipse cx="31" cy="30" rx="10" ry="6" fill="rgba(255,255,255,0.24)"/></svg>`;
      cardKeys.innerHTML = `<svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><rect x="12" y="19" width="48" height="33" rx="14" fill="${state.palette[2]}"/><g fill="${mixHex(state.palette[2], '#ffffff', 0.66)}"><rect x="18" y="25" width="10" height="9" rx="3"/><rect x="31" y="25" width="10" height="9" rx="3"/><rect x="44" y="25" width="10" height="9" rx="3"/><rect x="23" y="38" width="26" height="7" rx="3"/></g></svg>`;
    }

    function mixHex(c1, c2, ratio) {
      const a = hexToRgb(c1), b = hexToRgb(c2);
      const r = Math.round(a.r * (1-ratio) + b.r * ratio);
      const g = Math.round(a.g * (1-ratio) + b.g * ratio);
      const bVal = Math.round(a.b * (1-ratio) + b.b * ratio);
      return rgbToHex(r,g,bVal);
    }
    function mixAlpha(hex, alpha) {
      const {r,g,b} = hexToRgb(hex);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
    function hexToRgba(hex, alpha) {
      const {r,g,b} = hexToRgb(hex);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
    function hexToRgb(hex) {
      const clean = hex.replace('#','');
      const bigint = parseInt(clean, 16);
      return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
    }
    function rgbToHex(r,g,b) {
      return '#' + [r,g,b].map(v => v.toString(16).padStart(2, '0')).join('');
    }

    document.getElementById('startNowBtn').addEventListener('click', () => showScreen('shelf'));
    screens.opening.addEventListener('click', () => showScreen('shelf'));
    document.querySelectorAll('.toy-card').forEach(btn => btn.addEventListener('click', () => openToy(btn.dataset.toy)));
    document.getElementById('shuffleBtn').addEventListener('click', choosePalette);
    document.getElementById('overlayShuffle').addEventListener('click', () => { choosePalette(); resetCurrentToy(); });
    document.getElementById('settingsBtn').addEventListener('click', () => settingsOverlay.classList.add('active'));
    document.getElementById('playSettingsBtn').addEventListener('click', () => settingsOverlay.classList.add('active'));
    document.getElementById('closeSettingsBtn').addEventListener('click', () => settingsOverlay.classList.remove('active'));
    document.getElementById('backBtn').addEventListener('click', () => showScreen('shelf'));
    document.getElementById('shelfBtn').addEventListener('click', () => showScreen('shelf'));
    document.getElementById('resetBtn').addEventListener('click', resetCurrentToy);
    soundToggle.addEventListener('click', () => {
      state.soundOn = !state.soundOn;
      soundToggle.classList.toggle('off', !state.soundOn);
    });
    settingsOverlay.addEventListener('click', (e) => {
      if (e.target === settingsOverlay) settingsOverlay.classList.remove('active');
    });

    ['pointerdown','pointermove','pointerup','pointercancel','pointerleave'].forEach(type => {
      canvas.addEventListener(type, (event) => {
        if (type === 'pointerdown') { canvas.setPointerCapture(event.pointerId); handlePress(pointFromEvent(event)); }
        if (type === 'pointermove') handleMove(pointFromEvent(event));
        if (type === 'pointerup' || type === 'pointercancel' || type === 'pointerleave') handleRelease();
      });
    });

    window.addEventListener('resize', resizeCanvas);
    choosePalette();
    soundToggle.classList.remove('off');
    renderToyPreviews();
    renderCardVisuals();
    setTimeout(() => { if (state.screen === 'opening') showScreen('shelf'); }, 2600);
    requestAnimationFrame(render);
  </script>
</body>
</html>
