<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Squishy">
<title>Squishy Fidget</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
  /* Layout: slim toolbar on top, the toy fills the middle, big toy picker at the thumb. */
  /* Single deliberate look: a soft lilac playroom behind bright toys, the same in light and dark. */
  :root {
    --bg: #ece6fb;
    --bg-deep: #d9cff5;
    --ink: #2d2350;
    --ink-soft: #6a5f93;
    --chip: #ffffff;
    --chip-press: #f3efff;
    --accent: #7b5cff;
    --font-display: "Fredoka", "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, var(--bg) 40%, var(--bg-deep) 100%), var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px max(12px, env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
  }
  .bar { display: flex; align-items: center; gap: 8px; }
  .status {
    margin-right: auto;
    font-size: 1.25rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .status small { font-size: 0.85rem; font-weight: 500; color: var(--ink-soft); }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 1rem;
    color: var(--ink);
    background: var(--chip);
    border: 0;
    border-radius: 999px;
    padding: 10px 14px;
    min-height: 44px;
    min-width: 44px;
    box-shadow: 0 3px 0 var(--bg-deep), 0 6px 14px rgba(45, 35, 80, 0.12);
    touch-action: manipulation;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--bg-deep), 0 2px 6px rgba(45, 35, 80, 0.12); background: var(--chip-press); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #soundBtn[aria-pressed="false"] { color: var(--ink-soft); }
  .hint {
    text-align: center;
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin: 0;
    min-height: 1.3em;
  }
  .stage { position: relative; flex: 1; min-height: 0; }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .tabs button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 6px;
    border-radius: 20px;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }
  .tabs button[aria-pressed="true"] {
    color: var(--ink);
    box-shadow: 0 3px 0 var(--accent), 0 6px 14px rgba(123, 92, 255, 0.25);
  }
  .tab-icon { font-size: 1.6rem; line-height: 1.1; }
  .haptic-switch {
    position: fixed;
    left: -200px;
    top: 0;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0.01;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="status" id="status" aria-live="polite"></div>
    <button id="colorsBtn" type="button" aria-label="Change colours">🎨</button>
    <button id="flipBtn" type="button" aria-label="Flip the pop it">🔄</button>
    <button id="soundBtn" type="button" aria-pressed="true" aria-label="Sound">🔊</button>
    <button id="buzzBtn" type="button" aria-label="Test the buzz">📳</button>
  </div>
  <p class="hint" id="hint"></p>
  <div class="stage">
    <canvas id="board"></canvas>
  </div>
  <nav class="tabs" id="tabs" aria-label="Choose a toy"></nav>
</div>
<script src="js/paint.js"></script>
<script src="js/feel.js"></script>
<script src="js/popit.js"></script>
<script src="js/squishy.js"></script>
<script src="js/slime.js"></script>
<script src="js/app.js"></script>
</body>
</html>
